general:
  kafka-topic: midas-transactions
incentive:
  api-url: http://localhost:8080/incentive

spring:
  application:
    name: midas-core
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
    listener:
      ack-mode: record

  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # fine for dev/tests
    show-sql: true
  h2:
    console:
      enabled: true

server:
  port: 33400



